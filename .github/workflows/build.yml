name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.repository == 'my-mcp-hub/node-mcp-client'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Package
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Package
        run: npm run build

      - name: Test Package
        run: npm run coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
